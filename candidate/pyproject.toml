[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-training-resume-candidate"
version = "0.1.0"
description = "Candidate starter for the distributed training resume challenge"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.34",
  "psycopg[binary]>=3.1",
  "pyyaml>=6.0",
  "torch>=2.2,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8.2",
]

[tool.setuptools]
packages = ["src"]
